description: "Radio Medical Reviewer prompt evaluations"

prompts:
  - label: "Review JSON contract"
    raw: |
      You are reviewing a maritime radio medical report for simulation training.
      Return ONLY valid JSON with this schema:
      {
        "extracted": {},
        "deficiencies": [{"area":"string","issue":"string","severity":"low|medium|high","suggestion":"string"}],
        "safety_flags": ["string"],
        "completeness_score": 0-100
      }

      REPORT:
      {{report_text}}

providers:
  - id: ollama:llama3.1
    config:
      temperature: 0.2

tests:
  - description: "Complete report yields valid JSON and non-low completeness"
    vars:
      report_text: |
        Patient name: John Doe
        A Airway: clear. Jaw lift not needed.
        B Breathing: RR 16, SpO2 98% on room air.
        C Circulation: Pulse 78, BP 124/80, cap refill 1.5 sec.
        D Disability: Alert and oriented, pupils equal/reactive.
        E Exposure: No major findings, temp 36.7 C.
        Problem: minor hand laceration after slip on deck.
    assert:
      - type: is-json
      - type: javascript
        value: |
          const d = JSON.parse(output);
          return typeof d.completeness_score === 'number' && d.completeness_score >= 60;
      - type: javascript
        value: |
          const d = JSON.parse(output);
          return Array.isArray(d.deficiencies) && Array.isArray(d.safety_flags);

  - description: "Missing vitals should produce deficiencies"
    vars:
      report_text: |
        Patient found unresponsive in cabin.
        Breathing appears shallow.
        No pulse documented.
        No blood pressure documented.
    assert:
      - type: is-json
      - type: javascript
        value: |
          const d = JSON.parse(output);
          return d.deficiencies.length > 0;
      - type: javascript
        value: |
          const d = JSON.parse(output);
          return d.completeness_score <= 60;

  - description: "Critical low SpO2 should be safety-flagged"
    vars:
      report_text: |
        Problem: severe dyspnea and chest pain.
        Breathing: RR 30, SpO2 86%.
        Circulation: Pulse 122, BP 95/60.
    assert:
      - type: is-json
      - type: javascript
        value: |
          const d = JSON.parse(output);
          return d.safety_flags.length > 0 || d.deficiencies.some(x => x.severity === 'high');
