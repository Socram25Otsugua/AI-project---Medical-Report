# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Combined suite — prefer `npm run test:prompts` (runs review + response configs separately).
description: Radio Medical AI — full prompt evaluation suite (Ollama)

providers:
  - id: ollama:chat:llama3.1
    config:
      temperature: 0.2
      passthrough:
        format: json

prompts:
  - file://prompts/review.txt
  - file://prompts/response.txt

defaultTest:
  options:
    provider: ollama:chat:llama3.1
  assert:
    - type: contains-json

tests:
  - description: Review — returns schema-valid JSON for a complete ABCDE report
    prompt: file://prompts/review.txt
    tags: [review, schema]
    vars:
      report_text: file://fixtures/report_minimal.txt
    assert:
      - type: javascript
        value: file://assertions/review-schema.cjs

  - description: Review — assigns lower completeness when vitals are undocumented
    prompt: file://prompts/review.txt
    tags: [review, completeness]
    vars:
      report_text: file://fixtures/report_missing_vitals.txt
    assert:
      - type: javascript
        value: file://assertions/review-schema.cjs
      - type: javascript
        value: file://assertions/review-penalizes-incomplete-vitals.cjs

  - description: Response — returns action plan JSON aligned with production schema
    prompt: file://prompts/response.txt
    tags: [response, schema]
    vars:
      report_text: file://fixtures/report_minimal.txt
      review_json: file://fixtures/review_complete.json
    assert:
      - type: javascript
        value: file://assertions/response-schema.cjs

  - description: Response — addresses undocumented vitals via questions or immediate actions
    prompt: file://prompts/response.txt
    tags: [response, vitals-gap]
    vars:
      report_text: file://fixtures/report_missing_vitals.txt
      review_json: file://fixtures/review_sparse.json
    assert:
      - type: javascript
        value: file://assertions/response-schema.cjs
      - type: javascript
        value: file://assertions/response-addresses-vitals-gap.cjs
